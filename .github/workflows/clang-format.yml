name: clang-format

on:
  - push

jobs:
  clang-format:
    name: clang-format
    runs-on: ubuntu-latest
    container:
      image: piyushkarki/tandem:latest
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Save GITHUB_WORKSPACE to env
        run: echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE" >> $GITHUB_ENV
      - name: Install clang-format
        run: pip3 install clang-format==19.1.3

      - name: Run clang-format
        working-directory: ${{ env.GITHUB_WORKSPACE }}
        run: |
          set -euo pipefail
          clang-format --version
          which clang-format
          ./.ci/format.sh $(which clang-format) .
          git diff > formatting.patch
          cat formatting.patch 
          if [ -s ./formatting.patch ]; then (exit 176); fi
        shell: bash
